  walkthroughs:
  - title: 'Prueba delimitada: FB_AlarmLatch'
    state: EJECUCIÓN OBSERVADA EN CPU VIRTUAL
    description: Enclavamiento y reconocimiento de alarma. El arnés ejecutado en PLCSIM registra nueve casos con resultados observados.
    steps:
    - Importar el SCL y compilar con TIA Portal V20 (0 errores, 0 avisos).
    - Descargar el arnés a una CPU virtual S7-1500.
    - Verificar las transiciones en nueve casos (65/65 pasos registrados).
    image_field: detail_image
