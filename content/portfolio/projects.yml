- repo: iagorobo24-hub/proyecto-pfc-iago-duran
  revision: 205725a895986358e6e49e27c3629648857f86ad
  title: PFC Tools
  category: DESARROLLO WEB · INGENIERÍA
  statement: Una SPA académica que reúne herramientas eléctricas y logísticas.
  pitch: Aplicación modular con catálogo, simulación, informes e integración de IA.
  problem: Las operaciones técnicas y logísticas suelen estar dispersas entre herramientas sin integración.
  solution: Unificar siete módulos especializados y su navegación en una misma aplicación web.
  stack:
  - React 19
  - Vite 7
  - Supabase
  - Vercel
  - Vitest
  - Playwright
  hero_image: assets/portfolio/pfc-dashboard.png
  hero_caption: Captura versionada de la navegación y el módulo Fichas Técnicas.
  detail_image: assets/portfolio/pfc-kpi-focus.png
  detail_caption: Detalle ampliado de una captura versionada del formulario de KPI; no es una prueba E2E.
  second_image: assets/portfolio/pfc-almacen-focus.png
  second_caption: Detalle ampliado de una captura versionada del inicio del simulador; no acredita su ejecución completa.
  capabilities:
  - Dashboard con acceso a los módulos de fichas, almacén e incidencias.
  - KPI, presupuestos y formación con funciones de gestión e informes.
  - Asistente SONEX y servicios de IA con gateway del lado servidor.
  evidence:
  - label: Descripción funcional
    description: Rutas de los siete módulos y límites documentados.
    url: https://github.com/iagorobo24-hub/proyecto-pfc-iago-duran/blob/205725a895986358e6e49e27c3629648857f86ad/README.md
  - label: Pruebas E2E
    description: Especificaciones de recorrido Playwright; requieren ejecución para acreditarse.
    url: https://github.com/iagorobo24-hub/proyecto-pfc-iago-duran/tree/205725a895986358e6e49e27c3629648857f86ad/app/e2e
  - label: CI del commit revisado
    description: La ejecución CI consultada terminó en fallo; no afirmar validación completa.
    url: https://github.com/iagorobo24-hub/proyecto-pfc-iago-duran/actions/runs/40444658645
  status: APLICACIÓN ACADÉMICA EN EVOLUCIÓN
  status_detail: Los módulos y las capturas están versionados. La CI principal del commit consultado terminó en fallo; no hay certificación
    E2E del despliegue.
  status_source: https://github.com/iagorobo24-hub/proyecto-pfc-iago-duran/actions/runs/40444658645
