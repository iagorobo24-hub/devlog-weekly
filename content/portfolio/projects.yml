- repo: iagorobo24-hub/awesome-tia-portal
  revision: 656213a21eed2646ff85ee0e330e6e1747bbc2d5
  title: Awesome TIA Portal
  category: AUTOMATIZACIÓN INDUSTRIAL
  statement: Una biblioteca técnica para estandarizar recursos de PLC y HMI.
  pitch: Documentación y contratos reutilizables para Siemens TIA Portal V20.
  problem: Los bloques repetidos y las interfaces inconsistentes dificultan mantener proyectos PLC.
  solution: Organizar UDT, FB/FC, OB, HMI y plantillas bajo contratos y documentación de uso explícita.
  stack:
  - TIA Portal V20
  - SCL
  - S7-1200 / S7-1500
  - HMI
  - Python
  hero_image: assets/portfolio/tia-flow-editorial.svg
  hero_caption: Esquema editorial basado en la arquitectura documentada; los módulos del catálogo no están todos implementados.
  detail_image: assets/portfolio/tia-plcsim.png
  detail_caption: Captura de panel PLCSIM versionada; no equivale a certificar toda la biblioteca.
  capabilities:
  - Catálogo de recursos con interfaces y dependencias documentadas.
  - Contratos UDT como punto de unión entre la lógica FB y la interfaz HMI.
  - Matriz de trazabilidad del estado y las pruebas de cada recurso.
  evidence:
  - label: Catálogo versionado
    description: Inventario de recursos y su grado de disponibilidad.
    url: https://github.com/iagorobo24-hub/awesome-tia-portal/blob/656213a21eed2646ff85ee0e330e6e1747bbc2d5/CATALOG.md
  - label: Trazabilidad por recurso
    description: Fuente, compilación y evidencias registradas.
    url: https://github.com/iagorobo24-hub/awesome-tia-portal/blob/656213a21eed2646ff85ee0e330e6e1747bbc2d5/MATRIZ-TRAZABILIDAD.md
  - label: Fuente SCL de alarma
    description: Caso concreto con fuente y evidencia de compilación; no extrapolable al conjunto.
    url: https://github.com/iagorobo24-hub/awesome-tia-portal/tree/656213a21eed2646ff85ee0e330e6e1747bbc2d5/bloques-de-funcion/fb-alarm-latch
  status: BIBLIOTECA EN VALIDACIÓN
  status_detail: Predominan los recursos documentados; las importaciones XML generalizadas y la validación de todos los bloques siguen
    pendientes.
  status_source: https://github.com/iagorobo24-hub/awesome-tia-portal/blob/656213a21eed2646ff85ee0e330e6e1747bbc2d5/README.md
  limitations:
  - La mayoría de las fichas no tiene bloque XML importable.
  - Una prueba concreta no acredita el funcionamiento del conjunto.
  next_steps:
  - Completar exportaciones y pruebas reproducibles por recurso.
  - Publicar evidencia de importación y ejecución donde exista.
