name: devlog semanal

on:
  schedule:
    - cron: '0 7 * * MON'   # UTC. En horario de verano español son las 09:00.
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: 'Solo Drive: PDF sintético, SHA256; sin GitHub, NVIDIA ni state'
        type: boolean
        required: true
        default: true
      solo_portfolio:
        description: 'Portfolio V2: requiere desmarcar modo_prueba; no modifica devlog semanal ni state'
        type: boolean
        required: false
        default: false
permissions:
  contents: read

# Evita que cron y un disparo manual compitan por el mismo estado y PDFs.
concurrency:
  group: devlog-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - name: Tests de regresión
        run: uv run python -m unittest discover -s tests -v

  devlog:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Rechazar modos manuales incompatibles
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.solo_portfolio == true && inputs.modo_prueba == true }}
        run: |
          echo "::error::Para solo_portfolio, desmarca modo_prueba: el modo de prueba verifica exclusivamente Drive."
          exit 1

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked

      - name: Validar configuración de Drive antes de recopilar y generar
        # No muestra tokens ni llama a Drive. Un secreto incompleto falla antes
        # de consumir API de NVIDIA, render y almacenamiento temporal.
        run: uv run --locked python -m src.drive_readiness
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_REMOTE: gdrive

      - uses: actions/setup-node@v7
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        with:
          node-version: '22'
      - name: Instalar Marp CLI desde package-lock.json
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        run: |
          npm ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/marp --version

      - name: Instalar rclone
        run: bash scripts/install-rclone-pinned.sh

      - name: Instalar ffmpeg
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Recoger
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python src/collect.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sintetizar
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python src/synthesize.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Validar consistencia antes de renderizar o publicar
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python -m src.confirm_pipeline_state --check-only

      - name: Renderizar
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python src/render.py

      - name: Publicar
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python src/publish.py
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Prueba aislada de Drive con PDF sintético y SHA256
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba == true && inputs.solo_portfolio != true }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_REMOTE: gdrive
        run: uv run --locked python -m src.drive_smoke

      - name: Generar y validar Portfolio Editorial V2 (PDF + vídeo + subtítulos)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        # Sólo se exponen las rutas de publicación una vez que pasa la validación de PDF y vídeo.
        run: |
          if [ "${{ inputs.solo_portfolio }}" = "true" ]; then
            uv run --with pymupdf python src/run_portfolio_v2.py --force
          else
            uv run --with pymupdf python src/run_portfolio_v2.py
          fi

      - name: Publicar deck maestro
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        # Sube los resultados V2 ya verificados; sin actividad showcase se omite.
        run: uv run python src/publish.py --target master
        env:
          PORTFOLIO_V2_RELEASE: '1'
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Confirmar estado
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        # Después de publicar semanal y master: si alguna fase falla,
        # no se avanza state/. Reintentos pueden repetir publicaciones
        # externas, pero no pierden la ventana GitHub pendiente.
        run: |
          uv run python -m src.confirm_pipeline_state

      - name: Guardar estado
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: |
          git config user.name "devlog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: semana $(date +%Y-W%V)"
          git push
