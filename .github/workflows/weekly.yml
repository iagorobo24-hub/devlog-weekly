name: devlog semanal

on:
  schedule:
    - cron: '0 7 * * MON'   # UTC. En horario de verano español son las 09:00.
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: 'Verificar Drive con un PDF aislado; no sobrescribir W44 ni guardar state'
        type: boolean
        required: true
        default: true
      solo_portfolio:
        description: 'Publicar solo el portfolio V2; no recopilar ni modificar devlog semanal ni state'
        type: boolean
        required: false
        default: false
permissions:
  contents: read

# Evita que cron y un disparo manual compitan por el mismo estado y PDFs.
concurrency:
  group: devlog-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Tests de regresión
        run: uv run python -m unittest discover -s tests -v

  devlog:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync

      - uses: actions/setup-node@v7
      - run: npm install -g @marp-team/marp-cli

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Recoger
        if: ${{ inputs.solo_portfolio != true }}
        run: uv run python src/collect.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sintetizar
        if: ${{ inputs.solo_portfolio != true }}
        run: uv run python src/synthesize.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Renderizar
        if: ${{ inputs.solo_portfolio != true }}
        run: uv run python src/render.py

      - name: Publicar
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: uv run python src/publish.py
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Prueba de extremo a extremo en Drive, con descarga y SHA256
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo_prueba == true && inputs.solo_portfolio != true }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import os
          import tempfile
          from pathlib import Path
          from src.publish import upload

          original = Path("out/deck.pdf")
          if not original.is_file() or original.stat().st_size == 0:
              raise SystemExit("No se generó un PDF válido")
          remote_name = os.environ.get("RCLONE_REMOTE", "gdrive")
          destination = (
              f"{remote_name}:Portfolio/verificaciones/"
              f"{os.environ['GITHUB_RUN_ID']}/devlog.pdf"
          )
          config = os.environ["RCLONE_CONF"]
          if not config:
              raise SystemExit("Falta RCLONE_CONF")
          upload(original, destination, config, remote_name, immutable=True)
          with tempfile.TemporaryDirectory() as directory:
              copy = Path(directory) / "devlog-download.pdf"
              upload(Path(destination), str(copy), config, remote_name)
              sha_local = hashlib.sha256(original.read_bytes()).hexdigest()
              sha_drive = hashlib.sha256(copy.read_bytes()).hexdigest()
              if sha_local != sha_drive:
                  raise SystemExit("ERROR: no coincide SHA256 del PDF en Drive")
          print("SUCCESS: Drive ha guardado y devuelto un PDF byte a byte idéntico")
          print(f"Ruta aislada verificada: {destination}")
          print(f"SHA256: {sha_local}")
          PY

      - name: Confirmar estado
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        # Deliberadamente después de publish.py: si algo falla antes de aquí,
        # el job para y state/ no se toca, así que la semana se puede
        # reintentar sin perder la ventana ni duplicar narrativa.
        run: |
          uv run python src/collect.py --commit-state
          uv run python src/synthesize.py --commit-state

      - name: Generar y validar Portfolio Editorial V2 (PDF + vídeo + subtítulos)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        # Sólo se exponen las rutas de publicación una vez que pasa la validación de PDF y vídeo.
        run: |
          if [ "${{ inputs.solo_portfolio }}" = "true" ]; then
            uv run --with pymupdf python src/run_portfolio_v2.py --force
          else
            uv run --with pymupdf python src/run_portfolio_v2.py
          fi

      - name: Publicar deck maestro
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false }}
        # Sube los resultados V2 ya verificados; sin actividad showcase se omite.
        run: uv run python src/publish.py --target master
        env:
          PORTFOLIO_V2_RELEASE: '1'
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Guardar estado
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo_prueba == false) && inputs.solo_portfolio != true }}
        run: |
          git config user.name "devlog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: semana $(date +%Y-W%V)"
          git push
