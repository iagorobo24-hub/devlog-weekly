name: devlog semanal

on:
  schedule:
    - cron: '0 7 * * MON'   # UTC. En horario de verano español son las 09:00.
  workflow_dispatch:         # para dispararlo a mano
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly.yml'
      - 'src/collect.py'
      - 'src/synthesize.py'
      - 'src/publish.py'
      - 'tests/**'

permissions:
  contents: write            # necesario para comitear state/

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Tests de regresión
        run: uv run python -m unittest discover -s tests -v

  devlog:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync

      - uses: actions/setup-node@v7
      - run: npm install -g @marp-team/marp-cli

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Recoger
        run: uv run python src/collect.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sintetizar
        run: uv run python src/synthesize.py
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Renderizar
        run: uv run python src/render.py

      - name: Publicar
        run: uv run python src/publish.py
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Confirmar estado
        # Deliberadamente después de publish.py: si algo falla antes de aquí,
        # el job para y state/ no se toca, así que la semana se puede
        # reintentar sin perder la ventana ni duplicar narrativa.
        run: |
          uv run python src/collect.py --commit-state
          uv run python src/synthesize.py --commit-state

      - name: Renderizar deck maestro
        # Después de "Confirmar estado" a propósito: lee state/narrative/*.md,
        # y ahí ya está la narrativa actualizada con lo de esta semana (antes
        # de "Confirmar estado" seguiría siendo la de la semana pasada). Se
        # salta solo si ningún repo showcase tuvo actividad.
        run: uv run python src/render_master.py

      - name: Renderizar vídeo del deck maestro
        # Lee out/portfolio.md (lo acaba de escribir el paso anterior) y
        # narra cada slide con edge-tts. Mismo umbral que render_master.py,
        # así que se salta sola si ese paso también se saltó.
        run: uv run python src/render_video.py

      - name: Publicar deck maestro
        # Sube out/portfolio.pdf y, si se generó, out/portfolio.mp4.
        run: uv run python src/publish.py --target master
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}

      - name: Guardar estado
        run: |
          git config user.name "devlog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: semana $(date +%Y-W%V)"
          git push
