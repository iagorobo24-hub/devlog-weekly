name: devlog histórico verificable

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Inicio ISO UTC inclusivo'
        required: true
        default: '2026-08-31T14:38:32.972001+00:00'
      until:
        description: 'Fin ISO UTC exclusivo'
        required: true
        default: '2026-10-26T00:00:00+00:00'
      publicar_drive:
        description: 'Opt-in: copiar el histórico a Drive (destino inmutable)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'src/backfill.py'
      - 'tests/test_backfill.py'
      - '.github/workflows/backfill.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - name: Pruebas
        run: uv run python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar Marp CLI desde package-lock.json
        run: |
          npm ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          ./node_modules/.bin/marp --version
      - name: Reconstruir archivos históricos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKFILL_SINCE: ${{ inputs.since || '2026-08-31T14:38:32.972001+00:00' }}
          BACKFILL_UNTIL: ${{ inputs.until || '2026-10-26T00:00:00+00:00' }}
        run: |
          uv run python src/backfill.py --since "$BACKFILL_SINCE" --until "$BACKFILL_UNTIL" --pdf
      - name: Entregar archivo sin publicar en Drive
        uses: actions/upload-artifact@v4
        with:
          name: devlog-preview-${{ github.run_id }}
          path: out/backfill/*
          if-no-files-found: error
          retention-days: 90

      - name: Instalar rclone
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar_drive == true }}
        run: bash scripts/install-rclone-pinned.sh
      - name: Guardar histórico en carpeta nueva de Drive (sin sobreescribir)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar_drive == true }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
        run: uv run python src/publish_backfill.py
