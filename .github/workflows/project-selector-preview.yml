name: Selector de proyectos · vista previa pública

on:
  schedule:
    - cron: '30 6 * * MON'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-selection-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Contratos de privacidad y ranking
        run: uv run python -m unittest tests.test_project_selection -v
      - name: Descubrir exclusivamente repositorios públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m src.select_projects --mode public
      - name: Validar salida pública
        run: |
          uv run python - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path("out/project-selection-public.json").read_text())
          assert result["visibility"] == "public"
          assert all(x["visibility"] == "public" for section in ("ranked","watchlist","other_active")
                     for x in result.get(section, []))
          assert result["limits"]["ranking_is_not_proof_of_functionality"] is True
          print("PUBLIC-ONLY selection verified")
          PYCODE
      - name: Verificar calidad pública por HEAD y CI real
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m src.audit_project_quality
      - name: Preparar revisión editorial sin cambiar el PDF
        run: uv run python -m src.selection_review
      - name: Validar borradores públicos de nuevos proyectos
        run: uv run python -m src.candidate_profiles
      - uses: actions/upload-artifact@v4
        with:
          name: project-selection-public-preview
          path: |
            out/project-selection-public.json
            out/project-selection-review.json
            out/project-quality-public.json
            out/candidate-profiles-review.json
          if-no-files-found: error
          retention-days: 14
