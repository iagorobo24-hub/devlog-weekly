name: devlog CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'config/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Tests de regresión
        run: uv run python -m unittest discover -s tests -v
      - name: Compilación estática
        run: uv run python -m compileall -q src tests

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - run: npm install -g @marp-team/marp-cli
      - name: Crear demostración sin secretos ni publicar
        run: |
          mkdir -p out
          cp tests/fixtures/weekly_sample.json out/summaries.json
          uv run python src/render.py
      - uses: actions/upload-artifact@v4
        with:
          name: devlog-quality-weekly-preview
          path: |
            out/deck.md
            out/deck.pdf
          if-no-files-found: error
          retention-days: 30
