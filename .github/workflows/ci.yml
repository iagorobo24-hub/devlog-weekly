name: devlog CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'config/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'templates/**'
      - 'config/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      prueba_modelo:
        description: 'Prueba aislada de NVIDIA con repos públicos, sin publicar'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Tests de regresión
        run: uv run python -m unittest discover -s tests -v
      - name: Compilación estática
        run: uv run python -m compileall -q src tests

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - run: npm install -g @marp-team/marp-cli
      - name: Crear demostración sin secretos ni publicar
        run: |
          mkdir -p out
          cp tests/fixtures/weekly_sample.json out/summaries.json
          uv run python src/render.py
      - name: Portfolio maestro paginado y validación de slides (sin voz, Drive ni estado)
        run: |
          uv run python src/render_master.py --force
          uv run python - <<'PYCODE'
          from src import render_master, render_video
          entries = render_master.load_portfolio_entries()
          expected = len(render_master.build_slides(entries)) + 1
          render_video.WORK_DIR.mkdir(parents=True, exist_ok=True)
          actual = render_video.export_slide_images()
          if len(actual) != expected:
              raise SystemExit(f"Desincronización de páginas: {len(actual)} != {expected}")
          print(f"PORTFOLIO PREVIEW: {len(entries)} proyectos, {len(actual)} diapositivas visuales")
          PYCODE
      - name: Generar portfolio editorial V2 en vista previa aislada
        run: |
          uv run --with pymupdf python src/render_portfolio_v2.py
          uv run python - <<'PYCODE'
          from src.portfolio_data import load_portfolio
          from src.render_portfolio_v2 import build_slides, MD_PATH, THEME
          import subprocess
          from pathlib import Path
          images_dir = Path("out/v2-png")
          images_dir.mkdir(parents=True, exist_ok=True)
          subprocess.run(["marp", str(MD_PATH), "--images", "png", "--no-stdin",
                          "--html", "--allow-local-files", "--theme-set", str(THEME),
                          "-o", str(images_dir / "slide.png")], check=True)
          expected = len(build_slides(load_portfolio()))
          images = list(images_dir.glob("slide.*.png"))
          if len(images) != expected:
              raise SystemExit(f"Las imágenes no coinciden con las diapositivas: {len(images)} != {expected}")
          print(f"PORTFOLIO V2: {expected} diapositivas y {len(images)} imágenes verificadas")
          PYCODE
      - name: Quality gate del PDF editorial V2
        run: |
          uv run --with pymupdf python src/quality_gate.py --pdf out/portfolio-v2.pdf --manifest out/portfolio-v2-manifest.json
      - name: Validar montaje audiovisual V2 sin servicio de voz ni Drive
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          uv run python src/render_video_v2.py --images-dir out/v2-png --smoke-tone --output out/portfolio-v2-smoke.mp4
          uv run python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          path = Path("out/portfolio-v2-smoke.mp4")
          meta = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "stream=codec_name",
              "-show_entries", "format=duration", "-of", "json", str(path)
          ]))
          codecs = {stream.get("codec_name") for stream in meta["streams"]}
          if not {"h264", "aac"} <= codecs or float(meta["format"]["duration"]) < 7:
              raise SystemExit("Vídeo editorial incompleto o sin audio")
          if not Path("out/portfolio-v2.srt").is_file():
              raise SystemExit("Faltan subtítulos")
          print("VIDEO SMOKE OK", codecs, meta["format"]["duration"])
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: devlog-quality-weekly-preview
          path: |
            out/deck.md
            out/deck.pdf
            out/portfolio.md
            out/portfolio.pdf
            out/video/slide.*.png
            out/portfolio-v2.md
            out/portfolio-v2.pdf
            out/portfolio-v2-manifest.json
            out/v2-png/slide.*.png
            out/portfolio-v2-smoke.mp4
            out/portfolio-v2.srt
          if-no-files-found: error
          retention-days: 30

  llm_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba_modelo == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: Recoger metadatos públicos para la prueba
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python src/collect.py --since 2026-10-12T00:00:00+00:00
      - name: Síntesis con NIM sin actualizar narrativa ni publicar
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python src/synthesize.py --no-state
      - uses: actions/upload-artifact@v4
        with:
          name: devlog-quality-real-model-probe
          path: out/summaries.json
          if-no-files-found: error
          retention-days: 14
