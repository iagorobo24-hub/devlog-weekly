<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">devlog-weekly</title>
  <desc id="d">Cron semanal que recoge la actividad de repositorios de GitHub, la resume con un modelo de lenguaje y genera un deck de portfolio en PDF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <circle cx="1100" cy="30" r="170" fill="#58a6ff" opacity=".10"/>
  <circle cx="960" cy="340" r="190" fill="#3fb950" opacity=".08"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="22" font-weight="600" fill="#58a6ff" letter-spacing="4">DEVLOG SEMANAL EN GITHUB ACTIONS</text>
    <text x="64" y="204" font-size="68" font-weight="800" fill="#f0f6fc">devlog<tspan fill="url(#ac)">-weekly</tspan></text>
    <text x="64" y="252" font-size="25" fill="#9fb0c3">De los commits de la semana a un deck de portfolio.</text>
    <g font-size="17" font-weight="600" fill="#e6edf3">
      <rect x="64" y="278" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/><text x="123" y="301" text-anchor="middle">PyGithub</text>
      <rect x="192" y="278" width="124" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/><text x="254" y="301" text-anchor="middle">NVIDIA NIM</text>
      <rect x="326" y="278" width="84" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/><text x="368" y="301" text-anchor="middle">Marp</text>
      <rect x="420" y="278" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".10"/><text x="479" y="301" text-anchor="middle">edge-tts</text>
    </g>
  </g>

  <g filter="url(#sh)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(760 70) rotate(-6 100 60)">
      <rect width="200" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="16" y="18" width="92" height="9" rx="4.5" fill="#58a6ff"/>
      <rect x="16" y="40" width="150" height="6" rx="3" fill="#30363d"/>
      <rect x="16" y="54" width="120" height="6" rx="3" fill="#30363d"/>
      <rect x="16" y="68" width="136" height="6" rx="3" fill="#30363d"/>
    </g>
    <g transform="translate(900 30)">
      <rect width="260" height="146" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
      <text x="22" y="40" font-size="22" font-weight="800" fill="#f0f6fc">Devlog semanal</text>
      <rect x="22" y="52" width="60" height="4" rx="2" fill="url(#ac)"/>
      <text x="22" y="86" font-size="14" fill="#9fb0c3">• avance 1</text>
      <text x="22" y="108" font-size="14" fill="#9fb0c3">• avance 2</text>
      <text x="22" y="130" font-size="14" fill="#3fb950">Estado: ...</text>
    </g>
    <g transform="translate(1000 170) rotate(5 100 60)">
      <rect width="200" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
      <rect x="16" y="18" width="70" height="9" rx="4.5" fill="#3fb950"/>
      <rect x="16" y="40" width="150" height="6" rx="3" fill="#30363d"/>
      <rect x="16" y="54" width="110" height="6" rx="3" fill="#30363d"/>
      <rect x="16" y="68" width="130" height="6" rx="3" fill="#30363d"/>
    </g>
  </g>
</svg>
