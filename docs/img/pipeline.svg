<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona</title>
  <desc id="d">Dos cadenas de scripts que se pasan ficheros: la semanal (recoger, sintetizar, renderizar, publicar) y la del deck maestro (maquetar, vídeo narrado, publicar).</desc>
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#7d8590"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="600" rx="20" fill="#0d1117"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="58" font-size="26" font-weight="800" fill="#f0f6fc">Cómo funciona</text>
    <rect x="48" y="68" width="64" height="4" rx="2" fill="url(#hd)"/>

    <text x="48" y="112" font-size="15" font-weight="700" fill="#58a6ff" letter-spacing="2">CADENA SEMANAL</text>

    <rect x="40" y="128" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="160" font-size="19" font-weight="700" fill="#f0f6fc">1 · Recoger</text>
    <text x="60" y="186" font-size="14" fill="#c9d1d9">collect.py · sin IA</text>
    <text x="60" y="210" font-size="14" fill="#9fb0c3">Commits, diff, issues, PRs</text>
    <text x="60" y="230" font-size="14" fill="#9fb0c3">y tags nuevos vía API</text>
    <text x="60" y="262" font-size="13" fill="#7d8590">PyGithub · GH_PAT</text>

    <rect x="376" y="128" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="396" y="160" font-size="19" font-weight="700" fill="#f0f6fc">2 · Sintetizar</text>
    <text x="396" y="186" font-size="14" fill="#c9d1d9">synthesize.py · LLM</text>
    <text x="396" y="210" font-size="14" fill="#9fb0c3">Una llamada por repo con</text>
    <text x="396" y="230" font-size="14" fill="#9fb0c3">actividad; cadena de modelos</text>
    <text x="396" y="262" font-size="13" fill="#7d8590">NVIDIA NIM · NVIDIA_API_KEY</text>

    <rect x="712" y="128" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="732" y="160" font-size="19" font-weight="700" fill="#f0f6fc">3 · Renderizar</text>
    <text x="732" y="186" font-size="14" fill="#c9d1d9">render.py · plantilla fija</text>
    <text x="732" y="210" font-size="14" fill="#9fb0c3">Markdown con Jinja2 y</text>
    <text x="732" y="230" font-size="14" fill="#9fb0c3">PDF con Marp</text>
    <text x="732" y="262" font-size="13" fill="#7d8590">tema templates/theme.css</text>

    <rect x="1048" y="128" width="192" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="1068" y="160" font-size="19" font-weight="700" fill="#f0f6fc">4 · Publicar</text>
    <text x="1068" y="186" font-size="14" fill="#c9d1d9">publish.py</text>
    <text x="1068" y="210" font-size="14" fill="#9fb0c3">Sube el PDF a Drive</text>
    <text x="1068" y="230" font-size="14" fill="#9fb0c3">en semanal/AAAA-Wss</text>
    <text x="1068" y="262" font-size="13" fill="#7d8590">rclone · RCLONE_CONF</text>

    <g stroke="#7d8590" stroke-width="2" marker-end="url(#ar)">
      <line x1="256" y1="203" x2="372" y2="203"/>
      <line x1="592" y1="203" x2="708" y2="203"/>
      <line x1="928" y1="203" x2="1044" y2="203"/>
    </g>
    <g font-size="12.5" font-weight="600" fill="#58a6ff" text-anchor="middle">
      <text x="314" y="190">collected</text><text x="314" y="224">.json</text>
      <text x="650" y="190">summaries</text><text x="650" y="224">.json</text>
      <text x="986" y="190">deck.md</text><text x="986" y="224">→ deck.pdf</text>
    </g>

    <text x="48" y="306" font-size="13" fill="#7d8590">Entradas: config/repos.yml (repos y escaparate) · state/last_run.json (desde cuándo) · state/narrative/*.md (lo ya contado)</text>

    <text x="48" y="360" font-size="15" font-weight="700" fill="#3fb950" letter-spacing="2">CADENA DEL DECK MAESTRO (SOLO REPOS SHOWCASE)</text>

    <rect x="40" y="376" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="408" font-size="19" font-weight="700" fill="#f0f6fc">5 · Maquetar</text>
    <text x="60" y="434" font-size="14" fill="#c9d1d9">render_master.py · sin IA</text>
    <text x="60" y="458" font-size="14" fill="#9fb0c3">Una slide por repo, con</text>
    <text x="60" y="478" font-size="14" fill="#9fb0c3">su narrativa acumulada</text>
    <text x="60" y="510" font-size="13" fill="#7d8590">Marp → portfolio.pdf</text>

    <rect x="376" y="376" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="396" y="408" font-size="19" font-weight="700" fill="#f0f6fc">6 · Vídeo narrado</text>
    <text x="396" y="434" font-size="14" fill="#c9d1d9">render_video.py</text>
    <text x="396" y="458" font-size="14" fill="#9fb0c3">Voz sintética sobre cada</text>
    <text x="396" y="478" font-size="14" fill="#9fb0c3">slide y unión en un .mp4</text>
    <text x="396" y="510" font-size="13" fill="#7d8590">edge-tts · ffmpeg</text>

    <rect x="712" y="376" width="216" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="732" y="408" font-size="19" font-weight="700" fill="#f0f6fc">7 · Publicar</text>
    <text x="732" y="434" font-size="14" fill="#c9d1d9">publish.py --target master</text>
    <text x="732" y="458" font-size="14" fill="#9fb0c3">PDF y vídeo a Drive,</text>
    <text x="732" y="478" font-size="14" fill="#9fb0c3">carpeta master/</text>
    <text x="732" y="510" font-size="13" fill="#7d8590">rclone</text>

    <rect x="1048" y="376" width="192" height="150" rx="14" fill="#0d1117" stroke="#3fb950" stroke-dasharray="6 5"/>
    <text x="1068" y="408" font-size="17" font-weight="700" fill="#3fb950">Umbral</text>
    <text x="1068" y="434" font-size="14" fill="#9fb0c3">Se salta todo si ningún</text>
    <text x="1068" y="454" font-size="14" fill="#9fb0c3">showcase tuvo actividad</text>
    <text x="1068" y="474" font-size="14" fill="#9fb0c3">no trivial esa semana</text>
    <text x="1068" y="506" font-size="13" fill="#7d8590">--force lo ignora</text>

    <g stroke="#7d8590" stroke-width="2" marker-end="url(#ar)">
      <line x1="256" y1="451" x2="372" y2="451"/>
      <line x1="592" y1="451" x2="708" y2="451"/>
    </g>
    <g font-size="12.5" font-weight="600" fill="#3fb950" text-anchor="middle">
      <text x="314" y="438">portfolio</text><text x="314" y="472">.md</text>
      <text x="650" y="438">portfolio</text><text x="650" y="472">.mp4</text>
    </g>

    <text x="48" y="560" font-size="13" fill="#7d8590">Cada script lee un fichero y escribe otro (out/, ignorado por git): se puede lanzar cualquier paso suelto.</text>
  </g>
</svg>
